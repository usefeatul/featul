name: Dependency security

on:
  pull_request:
  push:
    branches: [main, staging]
  schedule:
    # Sunday at 18:17 UTC; off the hour to reduce scheduler congestion.
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Reads bun.lock directly; no dependency installation or lifecycle scripts.
      # Any reported vulnerability or registry failure fails this check.
      - name: Audit all workspace dependencies
        run: bun audit
