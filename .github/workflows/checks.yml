name: Release checks
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: billing_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run lint
      - run: bun test
      - name: Billing regressions
        run: bun test packages/api/tests/billing.integration.test.ts
        env:
          BILLING_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/billing_test
      - name: Create isolated launch test database
        run: PGPASSWORD=test psql -h localhost -U postgres -c 'CREATE DATABASE launch_test'
      - name: Access, deletion and concurrency regressions
        run: bun test packages/api/tests/launch.integration.test.ts
        env:
          LAUNCH_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/launch_test
