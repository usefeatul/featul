name: Code checks

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.workspace }} / lint, types, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [app, web]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-only placeholders: CI never connects to production services.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/featul_ci
      BETTER_AUTH_SECRET: ci-build-only-placeholder-secret-not-for-deployment
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      UPSTASH_REDIS_REST_URL: https://redis.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-build-only-placeholder
      SENTRY_AUTH_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint workspace and shared dependencies
        run: bunx --no-install turbo run lint --filter='${{ matrix.workspace }}...'

      - name: Generate Next.js route types
        run: bunx --no-install next typegen apps/${{ matrix.workspace }}

      - name: Check workspace and shared types
        run: bunx --no-install turbo run check-types --filter='${{ matrix.workspace }}...'

      - name: Build workspace and shared dependencies
        run: bunx --no-install turbo run build --filter=${{ matrix.workspace }}
